<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVSpark – Build Your Resume</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    h1 {
      grid-column: span 2;
      text-align: center;
      color: #4f46e5;
    }
    form, .preview {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
    }
    .preview h2 {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Build Your Resume</h1>

    <!-- FORM -->
    <form>
      <input type="text" placeholder="Full Name" id="name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Skills (comma separated)" id="skills"></textarea>
    </form>

    <!-- PREVIEW -->
    <div class="preview">
      <h2 id="pname">Your Name</h2>
      <p><strong>Skills:</strong></p>
      <p id="pskills">Your skills will appear here</p>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById("name");
    const skillsInput = document.getElementById("skills");

    nameInput.oninput = () => {
      document.getElementById("pname").innerText = nameInput.value || "Your Name";
    };

    skillsInput.oninput = () => {
      document.getElementById("pskills").innerText = skillsInput.value || "Your skills will appear here";
    };
  </script>

</body>
</html>
