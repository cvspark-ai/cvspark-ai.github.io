<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVSpark – Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #4f46e5;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: #4338ca;
    }

    /* Resume */
    #resume {
      position: relative;
    }

    /* WATERMARK */
    .watermark {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 42px;
      color: rgba(0,0,0,0.15);
      pointer-events: none;
      user-select: none;
    }

    .label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    @media(max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<h1>Build Your Resume</h1>

<div class="container">

  <!-- FORM -->
  <div class="box">
    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    <textarea id="summary" placeholder="Profile Summary"></textarea>
    <textarea id="skills" placeholder="Skills"></textarea>
    <textarea id="experience" placeholder="Experience"></textarea>
    <textarea id="education" placeholder="Education"></textarea>

    <button onclick="downloadPDF()">Download Free PDF</button>

    <button onclick="unlockPremium()" style="background:#16a34a">
      Unlock Premium (Remove Watermark)
    </button>
  </div>

  <!-- PREVIEW -->
  <div class="box" id="resume">
    <div class="watermark" id="watermark">CVSpark</div>

    <h2 id="pname">Your Name</h2>
    <p id="pcontact">email@example.com | 0000000000</p>

    <span class="label">Profile</span>
    <p id="psummary">Profile summary here</p>

    <span class="label">Skills</span>
    <p id="pskills">Skills here</p>

    <span class="label">Experience</span>
    <p id="pexperience">Experience here</p>

    <span class="label">Education</span>
    <p id="peducation">Education here</p>
  </div>

</div>

<script>
  // Live preview
  const bind = (i, o) =>
    document.getElementById(i).oninput = e =>
      document.getElementById(o).innerText = e.target.value || document.getElementById(o).innerText;

  bind("name", "pname");
  bind("summary", "psummary");
  bind("skills", "pskills");
  bind("experience", "pexperience");
  bind("education", "peducation");

  document.getElementById("email").oninput =
  document.getElementById("phone").oninput = () => {
    pcontact.innerText =
      (email.value || "email@example.com") + " | " +
      (phone.value || "0000000000");
  };

  // PREMIUM CHECK
  function isPremium() {
    return localStorage.getItem("cvspark_premium") === "true";
  }

  function unlockPremium() {
    const code = prompt("Enter premium code:");
    if (code === "CVSPARK2026") {
      localStorage.setItem("cvspark_premium", "true");
      alert("Premium unlocked! Watermark removed.");
      document.getElementById("watermark").style.display = "none";
    } else {
      alert("Invalid code");
    }
  }

  // PDF
  function downloadPDF() {
    if (isPremium()) {
      document.getElementById("watermark").style.display = "none";
    } else {
      document.getElementById("watermark").style.display = "block";
    }

    html2pdf().from(document.getElementById("resume")).set({
      margin: 0.5,
      filename: 'CVSpark_Resume.pdf',
      html2canvas: { scale: 2 },
      jsPDF: { format: 'a4', orientation: 'portrait' }
    }).save();
  }

  // Auto-remove watermark if already paid
  if (isPremium()) {
    document.getElementById("watermark").style.display = "none";
  }
</script>

</body>
</html>
