<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CVSpark – Resume Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    /* Resume Preview */
    #resume h2 {
      margin-bottom: 5px;
    }

    #resume p {
      margin: 6px 0;
      font-size: 14px;
    }

    .label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    @media(max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Build Your Resume</h1>

  <div class="container">

    <!-- FORM -->
    <div class="box">
      <input type="text" id="name" placeholder="Full Name">
      <input type="email" id="email" placeholder="Email">
      <input type="text" id="phone" placeholder="Phone Number">
      <textarea id="summary" placeholder="Profile Summary"></textarea>
      <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
      <textarea id="experience" placeholder="Work Experience"></textarea>
      <textarea id="education" placeholder="Education"></textarea>

      <button onclick="downloadPDF()">Download PDF</button>
    </div>

    <!-- PREVIEW -->
    <div class="box" id="resume">
      <h2 id="pname">Your Name</h2>
      <p id="pemail">email@example.com | 0000000000</p>

      <span class="label">Profile</span>
      <p id="psummary">Your profile summary will appear here.</p>

      <span class="label">Skills</span>
      <p id="pskills">Your skills will appear here.</p>

      <span class="label">Experience</span>
      <p id="pexperience">Your work experience will appear here.</p>

      <span class="label">Education</span>
      <p id="peducation">Your education details will appear here.</p>
    </div>

  </div>

  <script>
    const bind = (input, output, prefix = "") => {
      document.getElementById(input).oninput = e => {
        document.getElementById(output).innerText =
          e.target.value ? prefix + e.target.value : document.getElementById(output).innerText;
      };
    };

    bind("name", "pname");
    bind("email", "pemail");
    bind("phone", "pemail", " | ");
    bind("summary", "psummary");
    bind("skills", "pskills");
    bind("experience", "pexperience");
    bind("education", "peducation");

    function downloadPDF() {
      const element = document.getElementById("resume");
      const opt = {
        margin: 0.5,
        filename: 'CVSpark_Resume.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }
  </script>

</body>
</html>
