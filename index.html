<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CVSpark – Resume Builder</title>

  <!-- jsPDF CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      color: #222;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #4338ca;
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CVSpark Resume Builder</h1>

    <input type="text" id="name" placeholder="Full Name">
    <input type="text" id="email" placeholder="Email">
    <input type="text" id="phone" placeholder="Phone Number">
    <textarea id="summary" placeholder="Professional Summary"></textarea>

    <select id="plan">
      <option value="free">Free (With Watermark)</option>
      <option value="paid">Paid (No Watermark)</option>
    </select>

    <button onclick="downloadPDF()">Download Resume PDF</button>

    <div class="note">
      Free users get watermark. Paid users get clean PDF.
    </div>
  </div>

  <script>
    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const name = document.getElementById("name").value || "Your Name";
      const email = document.getElementById("email").value || "";
      const phone = document.getElementById("phone").value || "";
      const summary = document.getElementById("summary").value || "";
      const plan = document.getElementById("plan").value;

      doc.setFontSize(18);
      doc.text(name, 20, 20);

      doc.setFontSize(11);
      doc.text(`Email: ${email}`, 20, 30);
      doc.text(`Phone: ${phone}`, 20, 38);

      doc.setFontSize(13);
      doc.text("Summary", 20, 55);

      doc.setFontSize(11);
      doc.text(summary, 20, 63, { maxWidth: 170 });

      // WATERMARK for FREE users
      if (plan === "free") {
        doc.setTextColor(200, 200, 200);
        doc.setFontSize(40);
        doc.text("CVSPARK", 35, 150, { angle: 45 });
        doc.setTextColor(0, 0, 0);
      }

      doc.save("CVSpark_Resume.pdf");
    }
  </script>

</body>
</html>
